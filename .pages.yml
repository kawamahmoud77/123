media:
  input: images/uploads
  output: images/uploads
  rename: safe
  categories: [image]

content:
  - name: site
    label: Website content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: business
        label: Business details
        type: object
        fields:
          - { name: businessName, label: Business name, type: string }
          - { name: shortName, label: Short name, type: string }
          - { name: tagline, label: Tagline / area, type: string }
          - { name: logoInitials, label: Backup logo initials, type: string }
          - { name: logoImage, label: Logo image - square PNG 1:1, type: image, required: false }
          - { name: logoAlt, label: Logo alt text, type: string, required: false }
          - { name: phoneDisplay, label: Phone display, type: string }
          - { name: phoneTel, label: Phone link number, type: string }
          - { name: whatsappNumber, label: WhatsApp number, type: string }
          - { name: whatsappMessage, label: WhatsApp opening message, type: string }
          - { name: email, label: Email - used only for schema/records, type: string, required: false }
          - { name: websiteUrl, label: Website URL, type: string }
          - { name: facebookUrl, label: Facebook page URL, type: string, required: false }
          - { name: serviceArea, label: Service area, type: string }
          - { name: yearFoundedText, label: Experience text, type: string }
          - { name: footerYear, label: Footer year, type: string }

      - name: seo
        label: SEO
        type: object
        fields:
          - { name: pageTitle, label: Page title, type: string }
          - { name: description, label: Google description, type: text }

      - name: hero
        label: Hero / main cover section
        type: object
        fields:
          - { name: badge, label: Small badge text, type: string }
          - { name: headlineLine1, label: Headline line 1, type: string }
          - { name: headlineLine2, label: Headline line 2, type: string }
          - { name: highlightWord, label: Highlighted word, type: string, required: false }
          - { name: intro, label: Intro text, type: text }
          - { name: image, label: Main sign image - 946 x 400 px, type: image, required: false }
          - { name: imageAlt, label: Main sign image alt text, type: string, required: false }
          - { name: imagePlaceholderTitle, label: Placeholder title, type: string, required: false }
          - { name: imagePlaceholderText, label: Placeholder text, type: string, required: false }
          - name: stats
            label: Stats
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{number} - {label}"
            fields:
              - { name: number, label: Number / word, type: string }
              - { name: label, label: Label, type: string }

      - name: trustPoints
        label: Trust points
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: string }
          - name: icon
            label: Icon
            type: select
            options:
              values: [star, check, home, clock]

      - name: servicesSection
        label: What We Do / services with slideshows
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - name: services
            label: Service cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Service title, type: string }
              - { name: description, label: Description, type: text }
              - name: icon
                label: Icon
                type: select
                options:
                  values: [trowel, home, roller, ceiling, repair, sparkle, walls]
              - name: photos
                label: Photos for this service - 480 x 640 px vertical 3:4
                type: object
                required: false
                list:
                  collapsible:
                    collapsed: true
                    summary: "{caption}"
                fields:
                  - { name: image, label: Photo - 480 x 640 px, type: image }
                  - { name: caption, label: Caption, type: string, required: false }
                  - { name: alt, label: Alt text, type: string, required: false }

      - name: about
        label: About / job image section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: image, label: Job image - 1385 x 1847 px, type: image, required: false }
          - { name: imageAlt, label: Job image alt text, type: string, required: false }
          - { name: imagePlaceholderTitle, label: Placeholder title, type: string, required: false }
          - { name: imagePlaceholderText, label: Placeholder text, type: string, required: false }
          - name: bullets
            label: Bullet points
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Bold part, type: string }
              - { name: text, label: Normal text, type: text }

      - name: areas
        label: Service area / map section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: areas, label: Areas/cities, type: string, list: true }
          - { name: note, label: Small area note, type: text }
          - { name: mapImage, label: Map image - 718 x 561 px, type: image, required: false }
          - { name: mapAlt, label: Map image alt text, type: string, required: false }
          - { name: mapPlaceholderTitle, label: Placeholder title, type: string, required: false }
          - { name: mapPlaceholderText, label: Placeholder text, type: string, required: false }

      - name: reviewsSection
        label: Reviews collage section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: collageImage, label: Facebook review collage - 1272 x 1024 px, type: image, required: false }
          - { name: collageAlt, label: Collage alt text, type: string, required: false }
          - { name: collagePlaceholderTitle, label: Placeholder title, type: string, required: false }
          - { name: collagePlaceholderText, label: Placeholder text, type: string, required: false }

      - name: process
        label: Quote process
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - name: steps
            label: Steps
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Step title, type: string }
              - { name: text, label: Step text, type: text }

      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: tipTitle, label: Tip title, type: string }
          - { name: tipText, label: Tip text, type: text }
          - { name: tipText2, label: Second tip text, type: text }

      - name: footer
        label: Footer
        type: object
        fields:
          - { name: description, label: Footer description, type: text }
          - { name: bottomText, label: Footer bottom text, type: string }
